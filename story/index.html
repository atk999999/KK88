<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thiên Đạo Simulator by Zesty</title>
    
    
    
    <!-- Google Fonts: Playfair Display (Display) & Merriweather (Body) + New Fonts for Customization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Source+Code+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    
    <style>
      body {
        /* Nebula Gradient: Deep Navy -> Purple -> Black */
        background: radial-gradient(circle at 50% -20%, #2e1065 0%, #1e1b4b 30%, #020617 80%);
        background-attachment: fixed;
        color: #e2e8f0;
        font-family: 'Merriweather', serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      
      p {
        margin-bottom: 1.25em;
        line-height: 1.8;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #eab308; /* Gold Hover */
      }

      /* Glassmorphism utilities */
      .glass {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(234, 179, 8, 0.1); /* Gold tint border */
      }
      
      .glass-panel {
        background: rgba(2, 6, 23, 0.5);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }

      .text-glow {
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
      }
      .text-glow-gold {
        text-shadow: 0 0 15px rgba(234, 179, 8, 0.6);
      }
      .text-glow-crimson {
        text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
      }
      .text-glow-purple {
        text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
      }
      
      .prose-content {
        font-size: 1.05rem;
        /* Color and Font Family will be controlled by inline styles in GameUI */
      }
      @media (min-width: 768px) {
        .prose-content {
          font-size: 1.125rem;
        }
      }

      /* Page Enter Helper Class */
      .page-enter-active {
        animation: pageEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
    </style>


</head>
  <body>
    <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
